name: IOP distributions
on:
  push:
    branches: [main]
    paths: ['iop/release.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, windows-2022, windows-11-arm, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked --manifest-path iop/daemon/Cargo.toml
      - name: Include native executor
        shell: python
        run: |
          from pathlib import Path
          import shutil, sys
          binary = 'iop-execd.exe' if sys.platform == 'win32' else 'iop-execd'
          destination = Path('src/ai4instruments/iop/bin')
          destination.mkdir(exist_ok=True)
          shutil.copy2(Path('iop/daemon/target/release') / binary, destination / binary)
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Install the built wheel
        shell: python
        run: |
          import subprocess, sys
          from pathlib import Path
          wheel, = Path('dist').glob('*.whl')
          subprocess.run([sys.executable,'-m','pip','install',str(wheel)+'[agent]','pyserial','pymodbus>=3.11,<4'],check=True)
      - run: python -m unittest discover -s tests -v
      - name: Install native desktop
        if: runner.os != 'Linux'
        run: python -m pip install "pywebview>=6.2,<7"
      - name: Install Windows ARM desktop runtime
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $script = Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1'
          $runtime = Join-Path $env:RUNNER_TEMP 'iop-dotnet'
          Invoke-WebRequest -Uri 'https://dot.net/v1/dotnet-install.ps1' -OutFile $script
          foreach ($framework in @('dotnet', 'windowsdesktop')) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Runtime $framework -Channel 10.0 -Architecture arm64 -InstallDir $runtime -NoPath
            if ($LASTEXITCODE -ne 0) { throw 'Desktop runtime installation failed' }
          }
          "IOP_DESKTOP_DOTNET_ROOT=$runtime" >> $env:GITHUB_ENV
      - name: Exercise native desktop and browser switching
        if: runner.os != 'Linux'
        timeout-minutes: 5
        run: python iop/interface/test/desktop.py
      - run: python scripts/build_iop_bundle.py
      - name: Verify the release installer and installed service
        timeout-minutes: 10
        run: python scripts/check_iop_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: iop-${{ matrix.os }}
          path: release/*.zip
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: iop/clients/typescript
      - run: npm test
        working-directory: iop/clients/typescript
      - run: npm pack
        working-directory: iop/clients/typescript
      - uses: actions/upload-artifact@v4
        with:
          name: iop-typescript
          path: iop/clients/typescript/*.tgz
  interface:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked --manifest-path iop/daemon/Cargo.toml
      - name: Include native executor
        run: mkdir -p src/ai4instruments/iop/bin && cp iop/daemon/target/release/iop-execd src/ai4instruments/iop/bin/
      - run: python -m pip install '.[desktop]'
      - run: npm ci
        working-directory: iop/interface
      - run: npx playwright install --with-deps chromium
        working-directory: iop/interface
      - name: Exercise browser workflows
        run: npm test
        working-directory: iop/interface
      - name: Install Linux desktop libraries
        run: sudo apt-get install -y libxtst6 libxkbfile1 libegl1 libopengl0
      - name: Exercise Linux native desktop
        timeout-minutes: 5
        env:
          QT_API: pyside6
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_DISABLE_SANDBOX: '1'
          QTWEBENGINE_CHROMIUM_FLAGS: '--disable-gpu --no-sandbox'
        run: python iop/interface/test/desktop.py
  publish:
    needs: [native, typescript, interface]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish IOP release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "import json; print(json.load(open('iop/release.json'))['version'])")
          gh release create "iop-v${version}" release/* --target "$GITHUB_SHA" --title "IOP ${version}" --notes-file iop/RELEASE.md
