name: IOP runtime
on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/iop/**'
      - 'pyproject.toml'
      - '.github/workflows/runtime.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . "pymodbus>=3.11,<4" pyserial
      - run: python -m unittest discover -s tests -v
      - run: python -m ai4instruments.iop --version
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: iop-${{ matrix.os }}-python-${{ matrix.python }}
          path: dist/*.whl
