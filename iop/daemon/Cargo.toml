[package]
name = "iop-execd"
version = "0.8.3"
edition = "2021"
license = "MIT"
description = "IOP native driver-process supervisor"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "io-std", "time"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
