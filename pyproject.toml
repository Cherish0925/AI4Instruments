[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4instruments"
version = "0.3.0"
description = "IOP persistent service for instruments and experiment programs"
requires-python = ">=3.10"
authors = [{name = "Shuxing Yang"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
iop = "ai4instruments.iop.cli:main"

[project.optional-dependencies]
devices = ["pyserial>=3.5", "pyvisa>=1.14", "pyvisa-py>=0.7", "pyusb>=1.2", "zeroconf>=0.130", "pymodbus>=3.11,<4"]

[tool.setuptools.package-data]
"ai4instruments.iop" = ["reader.html"]
