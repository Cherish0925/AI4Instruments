<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>IOP Runtime</title>
    <link rel="icon" type="image/svg+xml" href="/ui/mark.svg" />
    <link rel="stylesheet" href="/ui/app.css" />
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("iop-theme") || "light";
    </script>
  </head>
  <body>
    <a class="skip-link" href="#content">跳到内容 · Skip to content</a>
    <aside id="sidebar" class="sidebar">
      <a class="brand" href="#overview"
        ><img src="/ui/mark.svg" width="34" height="34" alt="" /><span
          >IOP <small>Runtime</small></span
        ></a
      >
      <button id="search-open" class="search-trigger">
        <span data-icon="search"></span
        ><span data-en="Find devices or experiments">查找设备与实验</span
        ><kbd>⌘ K</kbd>
      </button>
      <div class="nav-label" data-en="LABORATORY">实验室</div>
      <nav aria-label="主导航">
        <button data-view="overview">
          <span data-icon="grid"></span><span data-en="Overview">概览</span>
        </button>
        <button data-view="devices">
          <span data-icon="device"></span
          ><span data-en="Instruments & software">仪器与软件</span
          ><b id="nav-devices">—</b>
        </button>
        <button data-view="platforms">
          <span data-icon="network"></span
          ><span data-en="Platforms">实验平台</span><b id="nav-platforms">—</b>
        </button>
        <button data-view="runs">
          <span data-icon="activity"></span
          ><span data-en="Experiments">实验任务</span><b id="nav-runs">—</b>
        </button>
        <button data-view="resources">
          <span data-icon="layers"></span
          ><span data-en="Resources">运行资源</span>
        </button>
      </nav>
      <div class="sidebar-bottom">
        <button id="mode-switch" class="mode-button">
          <span data-icon="monitor"></span
          ><span data-en="Open desktop app">打开桌面应用</span
          ><span data-icon="arrow-up-right"></span>
        </button>
        <button data-view="settings" class="settings-button">
          <span data-icon="settings"></span
          ><span data-en="Connection & settings">连接与设置</span>
        </button>
        <div class="service-label">
          <span id="connection-dot" class="dot"></span
          ><span id="service-caption" data-en="Connecting">正在连接</span
          ><span id="sidebar-version"></span>
        </div>
      </div>
    </aside>
    <div class="shell">
      <header class="topbar">
        <button
          id="menu-toggle"
          class="icon-button"
          aria-label="展开导航"
          title="菜单"
        >
          <span data-icon="menu"></span>
        </button>
        <div class="breadcrumb">
          <span data-en="Laboratory">实验室</span><span>/</span
          ><strong id="view-title">概览</strong>
        </div>
        <div class="topbar-actions">
          <span id="host-label" class="host-label"></span
          ><button
            id="refresh-button"
            class="icon-button"
            title="刷新"
            aria-label="刷新"
          >
            <span data-icon="refresh"></span></button
          ><button id="new-run" class="button primary">
            <span data-icon="plus"></span
            ><span data-en="New experiment">新建实验</span>
          </button>
        </div>
      </header>
      <div
        id="connection-banner"
        class="connection-banner"
        role="status"
        hidden
      ></div>
      <main id="content" tabindex="-1"></main>
      <footer>
        <span>IOP Runtime</span
        ><span id="footer-status" data-en="Experiment service"
          >实验运行服务</span
        ><span id="updated-at"></span>
      </footer>
    </div>
    <dialog id="modal" class="modal">
      <div class="modal-heading">
        <div>
          <span id="modal-eyebrow" class="eyebrow"></span>
          <h2 id="modal-title"></h2>
        </div>
        <button
          id="modal-close"
          class="icon-button"
          aria-label="关闭"
          title="关闭"
        >
          <span data-icon="close"></span>
        </button>
      </div>
      <div id="modal-body"></div>
    </dialog>
    <dialog id="palette" class="palette">
      <div class="palette-search">
        <span data-icon="search"></span
        ><input
          id="palette-input"
          placeholder="搜索设备、平台、实验…"
          data-en-placeholder="Find devices, platforms or experiments…"
          autocomplete="off"
        /><kbd>Esc</kbd>
      </div>
      <div id="palette-results"></div>
    </dialog>
    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="/ui/app.js"></script>
  </body>
</html>
